# CI pipeline: every push that changes the app -> build a new image -> push to Docker Hub
#              -> write the new image tag into k8s/deployment.yaml (Argo CD picks it up)
name: CI - build and push image

on:
  push:
    branches: [main]
    paths: ["app/**"]        # run only when the app code changes
  workflow_dispatch:          # also allows a manual "Run workflow" button

permissions:
  contents: write             # needed to commit the updated YAML back to the repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Get the code
        uses: actions/checkout@v4

      - name: 2. Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 3. Make a version tag from the commit ID
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: 4. Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-app:${{ env.TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-app:latest

      - name: 5. Update the image tag in k8s/deployment.yaml
        run: |
          sed -i "s|image: .*/hello-app:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/hello-app:${TAG}|" k8s/deployment.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "CI: deploy hello-app:${TAG}" || echo "No change to commit"
          git push
